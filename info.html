<script>
const pages={
tentang:{title:'Tentang Tawon.my.id',body:`<p>Tawon.my.id adalah portal informasi digital yang menyajikan berita, pengetahuan praktis, cerita, dan inspirasi untuk pembaca Indonesia. Kami berupaya menyajikan informasi dengan bahasa yang jelas, konteks yang memadai, serta memperhatikan akurasi dan manfaat bagi pembaca.</p><h2>Ruang lingkup</h2><p>Konten mencakup berita nasional dan daerah, desa, ekonomi, teknologi, pendidikan, gaya hidup, lingkungan, artikel evergreen, dan tulisan storytelling. Artikel opini atau pengalaman ditandai sesuai konteksnya dan tidak disajikan sebagai fakta terverifikasi.</p><h2>Prinsip editorial</h2><ul><li>Mengutamakan akurasi, konteks, dan kepentingan pembaca.</li><li>Membedakan berita, opini, panduan, dan konten bersponsor.</li><li>Memperbaiki kesalahan secara proporsional dan terbuka.</li><li>Menghormati privasi, hak cipta, dan hak jawab.</li></ul>`},
redaksi:{title:'Redaksi dan Penulis',body:`<p>Konten Tawon.my.id diterbitkan oleh tim redaksi dan penulis yang tercantum pada setiap artikel. Nama penulis, tanggal terbit, serta informasi pembaruan ditampilkan pada artikel sesuai data publikasi yang tersedia.</p><p>Untuk pertanyaan mengenai penulis, koreksi, hak jawab, atau penggunaan konten, silakan hubungi redaksi melalui saluran kontak resmi yang dikelola penerbit.</p><div class="notice">Informasi nama badan usaha, alamat redaksi, dan kontak resmi harus diisi dan diverifikasi oleh pengelola sebelum halaman ini dijadikan informasi final penerbit.</div>`},
pedoman:{title:'Pedoman Media Siber',body:`<h2>Verifikasi dan keberimbangan</h2><p>Redaksi berupaya memeriksa informasi melalui sumber yang relevan, mengutamakan sumber primer bila tersedia, dan memberi konteks yang cukup. Informasi yang belum dapat diverifikasi tidak akan dinyatakan sebagai fakta pasti.</p><h2>Koreksi dan pembaruan</h2><p>Kesalahan faktual yang diketahui akan diperiksa dan diperbaiki. Perubahan substansial sebaiknya disertai keterangan pembaruan agar pembaca memahami perubahan informasi.</p><h2>Konten pengguna dan komentar</h2><p>Konten dari pengguna dapat dimoderasi jika memuat spam, fitnah, ancaman, data pribadi, ujaran kebencian, atau pelanggaran hukum. Pendapat pembaca tidak selalu mencerminkan sikap redaksi.</p><h2>Iklan dan konten bersponsor</h2><p>Materi iklan, afiliasi, dan kerja sama komersial harus diberi label yang jelas. Iklan tidak boleh disamarkan sebagai laporan editorial independen.</p><h2>Hak jawab</h2><p>Pihak yang merasa dirugikan oleh pemberitaan dapat mengajukan koreksi atau hak jawab dengan menyertakan tautan artikel, bagian yang dipersoalkan, penjelasan, serta dokumen pendukung yang relevan.</p>`},
koreksi:{title:'Koreksi, Ralat, dan Hak Jawab',body:`<p>Tawon.my.id menerima permintaan koreksi atas kesalahan faktual dan permintaan hak jawab dari pihak yang berkepentingan. Mohon sertakan judul atau URL artikel, bagian yang perlu diperiksa, penjelasan yang spesifik, dan bukti pendukung bila tersedia.</p><p>Redaksi akan meninjau permintaan berdasarkan akurasi, konteks, dan bukti yang dapat diperiksa. Pengiriman permintaan tidak otomatis menjamin perubahan; hasil peninjauan dilakukan secara proporsional.</p><div class="notice">Tambahkan alamat email atau formulir kontak redaksi yang aktif sebelum situs dipublikasikan secara luas.</div>`},
kontak:{title:'Kontak Redaksi',body:`<p>Untuk pertanyaan berita, koreksi, hak jawab, kerja sama, dan masukan pembaca, hubungi tim redaksi Tawon.my.id melalui kanal resmi yang dikelola penerbit.</p><div class="notice">Pengelola perlu mengisi alamat email redaksi, alamat korespondensi bila ada, dan jam layanan yang benar. Jangan menampilkan alamat atau nomor kontak yang belum aktif.</div><p>Untuk mempercepat tindak lanjut, cantumkan subjek pesan yang jelas dan tautan artikel terkait.</p>`},
privasi:{title:'Kebijakan Privasi',body:`<p>Kebijakan ini menjelaskan secara umum bagaimana Tawon.my.id dapat mengelola informasi saat pengunjung menggunakan situs. Data yang diproses bergantung pada fitur yang diaktifkan, seperti log teknis, formulir kontak, analitik, atau layanan iklan.</p><h2>Data teknis dan cookie</h2><p>Server dan penyedia layanan dapat memproses data teknis seperti alamat IP, jenis perangkat, browser, halaman yang diakses, dan waktu akses untuk keamanan, operasional, analitik, atau pencegahan penyalahgunaan. Cookie dan teknologi serupa hanya digunakan sesuai konfigurasi layanan yang aktif.</p><h2>Iklan dan pihak ketiga</h2><p>Jika layanan iklan pihak ketiga seperti Google AdSense diaktifkan, penyedia tersebut dapat menggunakan cookie atau teknologi serupa sesuai kebijakan dan pilihan privasi yang berlaku. Informasi tentang penggunaan cookie, personalisasi iklan, dan pilihan pengguna harus diperbarui mengikuti layanan yang benar-benar dipasang.</p><h2>Hak dan permintaan</h2><p>Pengunjung dapat menghubungi penerbit untuk menanyakan, memperbaiki, atau mengajukan permintaan terkait data pribadi sesuai hukum yang berlaku. Hindari mengirimkan data sensitif melalui kanal yang tidak aman.</p><div class="notice">Halaman ini merupakan draf kebijakan umum. Sesuaikan dengan layanan, formulir, analitik, iklan, dan praktik pemrosesan data yang benar-benar digunakan oleh situs sebelum dinyatakan final.</div>`},
syarat:{title:'Syarat dan Ketentuan',body:`<p>Dengan menggunakan Tawon.my.id, pengunjung diharapkan menggunakan situs secara sah, menghormati hak pihak lain, dan tidak mengganggu keamanan atau ketersediaan layanan.</p><h2>Hak cipta</h2><p>Konten yang dibuat oleh Tawon.my.id dilindungi sesuai ketentuan yang berlaku. Pengutipan harus wajar, menyebutkan sumber, dan tidak menggantikan karya asli. Penggunaan foto atau materi pihak ketiga harus mengikuti lisensi dan izin yang relevan.</p><h2>Batasan informasi</h2><p>Artikel bersifat informasi umum dan bukan pengganti nasihat profesional khusus. Pembaca sebaiknya memeriksa sumber primer untuk keputusan penting.</p><h2>Perubahan</h2><p>Syarat dapat diperbarui ketika fitur atau ketentuan hukum berubah. Versi yang berlaku ditampilkan pada halaman ini.</p>`},
iklan:{title:'Iklan dan Kerja Sama',body:`<p>Tawon.my.id dapat menyediakan ruang iklan dan kerja sama konten sesuai kebijakan editorial. Materi berbayar, sponsor, atau tautan afiliasi harus diidentifikasi dengan jelas dan tidak boleh menyesatkan pembaca.</p><p>Permintaan kerja sama sebaiknya mencantumkan identitas pengiklan, tujuan kampanye, produk atau layanan, materi kreatif, periode, dan kontak yang dapat diverifikasi.</p><div class="notice">Lengkapi kontak komersial dan kebijakan peninjauan iklan sebelum menerima kampanye. Redaksi berhak menolak materi yang tidak sesuai dengan hukum atau standar penerbit.</div>`}
};
